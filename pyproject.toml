[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datadog-license-attribution"
version = "0.8.0"
description = "A tool that collects license and copyright information for third party dependencies of a project."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Datadog, Inc.", email = "package@datadoghq.com" }
]
urls = { "Homepage" = "https://github.com/DataDog/dd-license-attribution/blob/main/README.md", "Repository" = "https://github.com/DataDog/dd-license-attribution" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "agithub",
    # Constraint, not a direct import. pluggy 1.7.0 (released 2026-10-15)
    # hardened hookspec discovery to static attribute lookup: a module-level
    # class decorated with HookspecMarker is no longer a discoverable spec
    # carrier. plugincode 32.0.0 (a dependency of scancode-toolkit, which we
    # import through scancode.api) uses exactly that pattern, so under
    # pluggy>=1.7 importing dd_license_attribution raises
    # "ValueError: did not find any 'plugincode.location_provider' hooks".
    # Everything importing this package shares that chain, so the constraint
    # belongs in the published metadata, not just CI.
    # DO NOT REMOVE OR BUMP until a plugincode / scancode-toolkit release
    # supports pluggy>=1.7 (upstream: aboutcode-org/plugincode), verified
    # against tests/contract/ - then delete this pin. (The matching CI
    # constrain step in integration-test.yml was already removed when the
    # action default moved to 0.8.0, whose published metadata carries this
    # constraint.)
    "pluggy<1.8",
    "scancode-toolkit",
    "typer>=0.27.0",
    "pytz",
    "giturlparse",
    "requests",
    "license-expression",
    "openai>=1.0.1",
    "anthropic>=0.18.1",
    "semver>=3.0.4",
    "spdx-tools>=0.8",
    "packaging>=24.0",
]

[project.optional-dependencies]
lint = [
    "black==26.10.1",
    "isort==9.0.2",
    "ruff==0.17.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.16.0",
    "mypy==2.4.0",
    "black==26.10.1",
    "isort==9.0.2",
    "ruff==0.17.0",
    "mutmut==3.8.0",
    "pytest-timeout==2.4.0",
    "types-pytz==2026.5.0.20261006",
    "types-requests==2.33.0.20261006"
]

[project.scripts]
dd-license-attribution = "dd_license_attribution.cli.main_cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=src/dd_license_attribution"
xfail_strict = "True"
filterwarnings = [
    "ignore::UserWarning:typecode.magic2:"
]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests/unit/"]
do_not_mutate = [
    "src/dd_license_attribution/cli/*",
    "src/dd_license_attribution/adaptors/*",
    "src/dd_license_attribution/config/*",
]
mutate_only_covered_lines = false
pytest_add_cli_args = ["--timeout=30", "--ignore=tests/unit/test_clean_spdx_id_command.py", "--ignore=tests/unit/test_generate_sbom_csv_command.py", "--ignore=tests/unit/test_generate_overrides_command.py"]

[tool.mypy]
strict = "True"
disallow_untyped_calls = "True"
disallow_untyped_defs = "True"
disallow_incomplete_defs = "True"
check_untyped_defs = "True"
warn_return_any = "True"
warn_unused_ignores = "True"
warn_redundant_casts = "True"

[[tool.mypy.overrides]]
module = "scancode.api"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scancode"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agithub.GitHub"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "giturlparse"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "license_expression"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "spdx_tools.*"
ignore_missing_imports = true

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["S101", "BLE001", "S602", "S605", "S606"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.isort]
profile = "black"

[tool.black]
required-version = "26.10.1"
