name: Run Tests to check CLIs are not fundamentally broken

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    name: integration (${{ matrix.python-version }})

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip" # caching pip dependencies

      - name: Set up Golang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # 6.5.0
        with:
          go-version: "1.23"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run the dd-license-attribution script with the --help flag
        run: |
          dd-license-attribution --help

      - name: Run the dd-license-attribution script against the Stratus Red Team repository only for root (quick fail)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom-csv --only-root-project https://github.com/DataDog/stratus-red-team

      # Exercise the reusable action against this repository. `repository`
      # defaults to github.repository, and the action builds its own
      # token-authenticated mirror pointing at the branch under test (the PR
      # head branch on PRs), so no mirror needs to be prepared here. Exact
      # comparison only happens on the primary development version (3.14);
      # dependency closures differ across Python versions (e.g. setuptools
      # appears on 3.11 but not 3.14), so other versions only get structural
      # validation.
      - name: Validate LICENSE-3rdparty.csv
        id: validate-license
        uses: ./
        with:
          override-spec: .ddla-overrides
          compare: ${{ matrix.python-version == '3.14' }}
          python-version: ${{ matrix.python-version }}
          go-version: "1.23"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The SPDX test below runs the CLI directly (not through the action), so
      # it still needs a mirror to scan the PR branch on pull_request events.
      - name: Prepare mirror configuration for the SPDX test
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref || '' }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Testing PR branch: ${HEAD_REF}"
            # Build the JSON with Python so that untrusted, PR-controlled values
            # (branch name, head repo) are properly escaped rather than
            # interpolated into a shell-quoted string.
            # Use head repo so fork PRs clone the branch from the fork, not upstream.
            HEAD_REF="${HEAD_REF}" PR_HEAD_REPO="${PR_HEAD_REPO}" python3 - <<'PY' > mirrors.json
          import json
          import os

          print(
              json.dumps(
                  [
                      {
                          "original_url": "https://github.com/DataDog/dd-license-attribution",
                          "mirror_url": f"https://github.com/{os.environ['PR_HEAD_REPO']}",
                          "ref_mapping": {
                              "branch:main": f"branch:{os.environ['HEAD_REF']}"
                          },
                      }
                  ]
              )
          )
          PY
          else
            echo "Testing main branch"
          fi

      - name: Run the dd-license-attribution script with SPDX output
        if: ${{ matrix.python-version == '3.14' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            dd-license-attribution generate-sbom --format spdx --use-mirrors=mirrors.json https://github.com/DataDog/dd-license-attribution > ddla-spdx-output.json
          else
            dd-license-attribution generate-sbom --format spdx https://github.com/DataDog/dd-license-attribution > ddla-spdx-output.json
          fi

          python - <<'PY'
          import json

          with open("ddla-spdx-output.json", encoding="utf-8") as spdx_file:
              document = json.load(spdx_file)

          packages = document.get("packages", [])
          relationships = document.get("relationships", [])

          assert document["spdxVersion"] == "SPDX-2.3"
          assert document["dataLicense"] == "CC0-1.0"
          assert document["name"] == "github.com/DataDog/dd-license-attribution"
          assert len(packages) > 1, "Expected real dependency data, not just the seed package"
          assert len(relationships) >= len(packages)
          assert any(
              package.get("name") == "github.com/DataDog/dd-license-attribution"
              for package in packages
          )
          PY

      - name: Upload ddla outputs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddla-output-${{ matrix.python-version }}
          path: |
            ${{ steps.validate-license.outputs.sbom-path }}
            ddla-spdx-output.json
          if-no-files-found: ignore

      - name: Run dd-license-attribution with --ecosystem go against a known Go package
        run: |
          dd-license-attribution generate-sbom-csv --ecosystem go --no-gh-auth github.com/DataDog/datadog-go/v5/statsd > go-ecosystem-output.txt
          # Validate output is non-empty CSV with expected header
          head -1 go-ecosystem-output.txt | grep -iq "component.*origin.*license.*copyright"
          # Validate at least some dependencies were found
          line_count=$(wc -l < go-ecosystem-output.txt)
          if [ "$line_count" -lt 2 ]; then
            echo "Error: Expected at least 1 dependency in output, got $((line_count - 1))"
            exit 1
          fi
          echo "Go ecosystem test passed: $((line_count - 1)) dependencies found"

      - name: Run dd-license-attribution with --ecosystem go (single-package module)
        run: |
          dd-license-attribution generate-sbom-csv --ecosystem go --no-gh-auth github.com/stretchr/objx@v0.5.2 > go-module-output.txt
          head -1 go-module-output.txt | grep -iq "component.*origin.*license.*copyright"
          grep -q "stretchr/objx" go-module-output.txt || { echo "Expected objx in output"; exit 1; }
          echo "Go ecosystem single-package module test passed"

      - name: Run dd-license-attribution with --ecosystem go (sub-package with pinned version)
        run: |
          dd-license-attribution generate-sbom-csv --ecosystem go --no-gh-auth github.com/stretchr/testify/assert@v1.9.0 > go-pinned-output.txt
          head -1 go-pinned-output.txt | grep -iq "component.*origin.*license.*copyright"
          # testify/assert has known transitive deps (davecgh/go-spew, pmezard/go-difflib, gopkg.in/yaml.v3)
          grep -q "go-spew" go-pinned-output.txt || { echo "Expected go-spew dependency"; exit 1; }
          grep -q "go-difflib" go-pinned-output.txt || { echo "Expected go-difflib dependency"; exit 1; }
          echo "Go ecosystem pinned sub-package test passed"

      - name: Upload go ecosystem output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-ecosystem-output-${{ matrix.python-version }}
          path: |
            go-ecosystem-output.txt
            go-module-output.txt
            go-pinned-output.txt
          if-no-files-found: ignore

      - name: Run dd-license-attribution with --experimental-strategy against a GitHub repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom --experimental-strategy https://github.com/DataDog/apigentools > experimental-github-output.txt
          head -1 experimental-github-output.txt | grep -iq "component.*origin.*license.*copyright"
          line_count=$(wc -l < experimental-github-output.txt)
          if [ "$line_count" -lt 6 ]; then
            echo "Error: Expected at least 5 dependencies, got $((line_count - 1))"
            exit 1
          fi
          echo "Experimental GitHub repo test passed: $((line_count - 1)) dependencies found"

      - name: Run dd-license-attribution with --experimental-strategy and --ecosystem python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom --experimental-strategy --ecosystem python apigentools > experimental-pypi-output.txt
          head -1 experimental-pypi-output.txt | grep -iq "component.*origin.*license.*copyright"
          line_count=$(wc -l < experimental-pypi-output.txt)
          if [ "$line_count" -lt 4 ]; then
            echo "Error: Expected at least 3 dependencies, got $((line_count - 1))"
            exit 1
          fi
          echo "Experimental ecosystem python test passed: $((line_count - 1)) dependencies found"

      - name: Test generate-overrides command with clean CSV
        run: |
          dd-license-attribution generate-overrides LICENSE-3rdparty.csv -o test-overrides.json
