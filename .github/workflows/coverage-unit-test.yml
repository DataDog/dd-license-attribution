name: Run Tests and Generate Coverage and Type Check

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      TERM: dumb

    steps:
      - name: Check out the repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: "3.14"
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy type checks
        run: mypy src tests

      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@7d2d231c02fd54a3da912e582ff87cb995d1fd30 # v1.0.4
        with:
          policy: dd-license-attribution-unit-test

      - name: Configure Datadog Test Optimization
        if: steps.dd-sts.outcome == 'success'
        uses: DataDog/test-visibility-github-action@4e7afb05b464fd349275e41e65a7f4de83e7f46b # v2.10.0
        with:
          languages: python
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          site: datadoghq.com
          code_coverage: "true"

      - name: Run contract tests
        env:
          JOB_ID: ${{ job.check_run_id }}
        run: pytest tests/contract

      - name: Run tests with coverage
        env:
          JOB_ID: ${{ job.check_run_id }}
        run: pytest --cov-report=xml --cov-fail-under=90 tests/unit

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage-report
          path: coverage.xml # This saves the report as an artifact in GitHub Actions
