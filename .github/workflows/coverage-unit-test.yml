name: Run Tests and Generate Coverage and Type Check

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      TERM: dumb

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.14"
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy type checks
        run: mypy src tests

      - name: Get Datadog credentials
        id: dd-sts
        continue-on-error: true
        uses: DataDog/dd-sts-action@639d841c72f15e4e77747bd726ef8105ce971da2 # v1.0.5
        with:
          policy: dd-license-attribution-unit-test

      - name: Configure Datadog Test Optimization
        if: steps.dd-sts.outcome == 'success'
        uses: DataDog/test-visibility-github-action@d6d648d87563e713b3d396bb3bfebb5e3cc93707 # v3.0.0
        with:
          languages: python
          api_key: ${{ steps.dd-sts.outputs.api_key }}
          site: datadoghq.com
          code_coverage: "true"

      - name: Run tests with coverage
        env:
          JOB_ID: ${{ job.check_run_id }}
          DD_CIVISIBILITY_ITR_ENABLED: "false"
        run: pytest --cov-report=xml --cov-fail-under=90 tests/unit

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: coverage-report
          path: coverage.xml # This saves the report as an artifact in GitHub Actions
