name: Mutation Base Cache

# Full-tree mutation baseline for main, cached per commit SHA. The PR
# workflow (mutation-regression.yml) restores this baseline for
# github.event.pull_request.base.sha and skips its own target-branch
# mutation run on a hit; on a miss it runs the target-branch run as
# before, so correctness never depends on this cache existing.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/unit/**"
      - "pyproject.toml"

permissions:
  contents: read

# Only the latest main SHA matters for future PRs (a PR's base.sha is the
# head of main when its event fires), so cancel an in-progress older run when
# a newer push supersedes it. A PR based on a cancelled SHA simply takes the
# miss path in mutation-regression.yml.
concurrency:
  group: mutation-base-cache
  cancel-in-progress: true

jobs:
  mutation-base:
    runs-on: ubuntu-latest
    # The full-tree run is much larger than a scoped PR run (~3-5k mutants,
    # ~2.5-4h measured against PR #260's per-file extrapolation). The
    # GitHub-hosted default job timeout is 6h; set it explicitly for clarity.
    timeout-minutes: 360

    env:
      TERM: dumb

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No history is needed: the baseline is generated for this exact
          # SHA only, and PRs reference it by SHA.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run full-tree mutation testing on main
        id: mutmut-run
        run: |
          # Record the exact generator so PRs can detect a mutmut version
          # skew against this baseline (see the compatibility check in
          # mutation-regression.yml). Mutant IDs are positional per
          # function, so a different mutmut version can renumber mutants
          # and change the per-module mutant population.
          mutmut --version > mutmut-base-tool.txt
          # paths_to_mutate = ["src/"] from pyproject.toml covers the full
          # mutable tree and honors the do_not_mutate excludes for
          # cli/adaptors/config; no pyproject rewrite is needed here.
          set +e
          mutmut run --max-children 4 2>&1 | tee mutmut-base-output.txt
          echo "${PIPESTATUS[0]}" > mutmut-base-exit.txt
          set -e
          mutmut results --all true > mutmut-base-results.txt
          # Record which files mutmut actually mutated: it rewrites every
          # tree file into mutants/, but only files it really mutated
          # contain __mutmut_ mutant definitions. Same shape as the per-run
          # lists recorded by the PR workflow's own runs.
          : > mutmut-base-mutated.txt
          find src/dd_license_attribution -name '*.py' \
            ! -path '*/cli/*' ! -path '*/adaptors/*' ! -path '*/config/*' \
            | while IFS= read -r p; do
                if grep -Fq '__mutmut_' "mutants/${p}" 2>/dev/null; then
                  echo "${p}" >> mutmut-base-mutated.txt
                fi
              done
          exit_code="$(cat mutmut-base-exit.txt)"
          if [ "$exit_code" = "0" ] && [ -s mutmut-base-results.txt ]; then
            echo "saveable=true" >> "$GITHUB_OUTPUT"
          else
            echo "saveable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::mutmut exited with ${exit_code} or produced no results; the baseline will NOT be cached. PRs based on this SHA will run their own target-branch mutation run."
          fi

      - name: Save the mutation baseline for this SHA
        # Cache only a healthy baseline: a non-zero exit (config error, no
        # test case for any mutant) or empty results must not poison PRs
        # keyed to this SHA. A cache save failure must never turn main red
        # either — the cache is an optimization whose miss path is the
        # pre-existing target-branch run, so failures here degrade to
        # cache misses on the next PR, not broken pipelines.
        if: steps.mutmut-run.outputs.saveable == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mutmut-base-${{ github.sha }}
          path: |
            mutmut-base-results.txt
            mutmut-base-exit.txt
            mutmut-base-output.txt
            mutmut-base-mutated.txt
            mutmut-base-tool.txt
