name: Mutation Base Cache

# Full-tree mutation baseline for main, cached per commit SHA. The PR
# workflow (mutation-regression.yml) restores this baseline for
# github.event.pull_request.base.sha and skips its own target-branch
# mutation run on a hit; on a miss it runs the target-branch run as
# before, so correctness never depends on this cache existing.
#
# Dry mode (default): the baseline is generated, analyzed and uploaded as
# a workflow artifact, but NOT written to the actions cache while the
# health checks that gate future saves are validated against real runs.
# PRs then always take the cache-miss path (their own target-branch run),
# which is the pre-cache behavior and always correct. Re-enable saving by
# setting the repository variable MUTMUT_CACHE_DRY_MODE=false.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/unit/**"
      - "pyproject.toml"
      - ".github/workflows/mutation-base-cache.yml"

permissions:
  contents: read

# Only the latest main SHA matters for future PRs (a PR's base.sha is the
# head of main when its event fires), so cancel an in-progress older run when
# a newer push supersedes it. A PR based on a cancelled SHA simply takes the
# miss path in mutation-regression.yml.
concurrency:
  group: mutation-base-cache
  cancel-in-progress: true

jobs:
  mutation-base:
    runs-on: ubuntu-latest
    # The full-tree run is much larger than a scoped PR run (thousands of
    # mutants, roughly five hours measured). The GitHub-hosted default job
    # timeout is 6h; set it explicitly for clarity.
    timeout-minutes: 360

    env:
      TERM: dumb
      # Dry mode defaults to ON: unset, empty, or any value other than
      # 'false' keeps cache saving disabled. The repository variable is
      # the flip switch, so re-enabling later needs no workflow change.
      MUTMUT_CACHE_DRY_MODE: ${{ vars.MUTMUT_CACHE_DRY_MODE != 'false' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No history is needed: the baseline is generated for this exact
          # SHA only, and PRs reference it by SHA.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Record runner conditions and mutation budget configuration
        # mutmut sizes each mutant's wall-clock budget from stats-phase
        # test durations: (covering-test time + timeout_constant) *
        # timeout_multiplier. A run whose pytest workers are pinned to
        # the runner's cores for hours can drift past those budgets under
        # contention and get classified as timeouts, so record what the
        # run had to work with to correlate outcomes with conditions.
        run: |
          {
            echo "cores=$(nproc)"
            free -h
            df -h .
          } | tee mutmut-runner-conditions.txt
          cores="$(nproc)"
          echo "RUNNER_CORES=${cores}" >> "$GITHUB_ENV"
          echo "MUTMETRIC runner_cores=${cores}"
          # Effective budget inputs; an unset value means the mutmut
          # default (timeout_constant=1.0, timeout_multiplier=15.0).
          python3 - <<'PY' | tee -a mutmut-runner-conditions.txt
          import tomllib

          with open("pyproject.toml", "rb") as config_file:
              config = tomllib.load(config_file).get("tool", {}).get("mutmut", {})
          for key in (
              "timeout_constant",
              "timeout_multiplier",
              "paths_to_mutate",
              "also_copy",
          ):
              print(f"mutmut.{key}={config.get(key, '<default>')}")
          PY
          echo "mutmut.max_children=4" | tee -a mutmut-runner-conditions.txt

      - name: Run full-tree mutation testing on main
        id: mutmut-run
        run: |
          # Record the exact mutation harness (generator + test runner +
          # plugins) so PRs can detect a version skew against this baseline
          # (see the compatibility check in mutation-regression.yml). Mutant
          # IDs are positional per function, so a different mutmut version
          # can renumber mutants and change the per-module mutant
          # population; a different pytest/pytest-* version can change
          # kill/timeout outcomes. A skewed harness must not be compared
          # against a PR's run.
          {
            mutmut --version
            pip show mutmut pytest pytest-timeout pytest-cov pytest-mock \
              | grep -E '^(Name|Version):' || true
          } > mutmut-base-tool.txt
          # Sample the load average while mutmut runs so timeout outcomes
          # can be correlated with runner contention (see the
          # runner-conditions step). Sampled lines are prefixed MUTLOAD
          # so they are greppable in the job log.
          : > mutmut-load-samples.txt
          (
            while true; do
              printf 'MUTLOAD %s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                "$(cat /proc/loadavg)" | tee -a mutmut-load-samples.txt
              sleep 60
            done
          ) &
          echo $! > .load-sampler.pid
          run_start="$(date +%s)"
          # paths_to_mutate = ["src/"] from pyproject.toml covers the full
          # mutable tree and honors the do_not_mutate excludes for
          # cli/adaptors/config; no pyproject rewrite is needed here.
          # Four workers: measured head-to-head, three children landed
          # the runner load right at the core count (loadavg1 avg 3.9
          # vs 6.1) but did not reduce the timeout ratio (26.9% vs
          # 27.2%) and ran ~45% slower. Throughput scales with workers
          # and the timeouts trace to fixed per-run overhead, not CPU
          # contention.
          set +e
          mutmut run --max-children 4 2>&1 | tee mutmut-base-output.txt
          echo "${PIPESTATUS[0]}" > mutmut-base-exit.txt
          set -e
          kill "$(cat .load-sampler.pid)" 2>/dev/null || true
          wall_seconds=$(( $(date +%s) - run_start ))
          echo "MUTMUT_RUN_WALL_SECONDS=${wall_seconds}" >> "$GITHUB_ENV"
          echo "MUTMETRIC mutmut_wall_seconds=${wall_seconds}"
          mutmut results --all true > mutmut-base-results.txt
          # Record which files mutmut actually mutated: it rewrites every
          # tree file into mutants/, but only files it really mutated
          # contain __mutmut_ mutant definitions. Same shape as the per-run
          # lists recorded by the PR workflow's own runs.
          : > mutmut-base-mutated.txt
          find src/dd_license_attribution -name '*.py' \
            ! -path '*/cli/*' ! -path '*/adaptors/*' ! -path '*/config/*' \
            | while IFS= read -r p; do
                if grep -Fq '__mutmut_' "mutants/${p}" 2>/dev/null; then
                  echo "${p}" >> mutmut-base-mutated.txt
                fi
              done
          exit_code="$(cat mutmut-base-exit.txt)"
          echo "MUTMETRIC mutmut_exit=${exit_code}"
          echo "MUTMETRIC result_lines=$(wc -l < mutmut-base-results.txt)"

      - name: Analyze baseline health
        id: baseline-health
        # A baseline is only safe to reuse as a PR comparison floor when
        # its outcomes are reproducible. The compare step in
        # mutation-regression.yml excludes 'timeout' from its baseline
        # score, so a run whose timeouts are environmental (runner
        # contention) rather than real hangs inflates per-file baseline
        # scores and can hand a changed file a strict 80% floor it cannot
        # legitimately meet. The tripwire below flags exactly that
        # combination: a module whose gate score meets the strict floor
        # while an implausible share of its mutants timed out.
        run: |
          # mutmut phase summary lines, e.g.
          # "done in 6798ms (1 files mutated, 0 ignored, 0 unmodified)".
          grep -o 'done in [0-9]*ms ([^)]*)' mutmut-base-output.txt \
            | tee mutmut-phase-timings.txt || true
          [ -f mutmut-base-results.txt ] || : > mutmut-base-results.txt
          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          # Mirrors MINIMUM_MUTATION_SCORE in mutation-regression.yml.
          GATE_FLOOR = 80.0
          # A module whose mutants time out more than this share is
          # presumed contention-contaminated: healthy scoped runs show
          # zero timeouts, while a contaminated full-tree run showed
          # roughly a quarter of all mutants as timeouts repo-wide.
          TIMEOUT_DISTRUST_RATIO = 0.10

          def parse_results(path):
              results = {}
              with open(path, encoding="utf-8") as results_file:
                  for line in results_file:
                      line = line.strip()
                      if ": " in line:
                          name, status = line.rsplit(": ", 1)
                          results[name.strip()] = status
              return results

          results = parse_results("mutmut-base-results.txt")
          overall = Counter(results.values())
          total = sum(overall.values())
          timeout_ratio = overall["timeout"] / total if total else 0.0

          modules = {}
          for name, status in results.items():
              # Mutants are named '<module>.<function-marker>__mutmut_N'
              # and function markers contain no dots, so the module is
              # everything up to the last dot before '__mutmut_'.
              cut = name.rfind(".", 0, name.find("__mutmut_"))
              module = name[:cut] if cut > 0 else name
              modules.setdefault(module, Counter())[status] += 1

          module_stats = {}
          tripwire = []
          for module, counts in sorted(modules.items()):
              module_total = sum(counts.values())
              scoreable = counts["killed"] + counts["survived"]
              gate_score = counts["killed"] / scoreable * 100 if scoreable else None
              entry = {
                  "total": module_total,
                  "killed": counts["killed"],
                  "survived": counts["survived"],
                  "timeout": counts["timeout"],
              }
              if gate_score is not None:
                  entry["gate_score"] = round(gate_score, 1)
              module_stats[module] = entry
              module_ratio = counts["timeout"] / module_total if module_total else 0.0
              if (
                  gate_score is not None
                  and gate_score >= GATE_FLOOR
                  and module_ratio > TIMEOUT_DISTRUST_RATIO
              ):
                  tripwire.append((module, counts["timeout"], module_total, module_ratio))

          telemetry = {
              "sha": os.environ["GITHUB_SHA"],
              "runner_cores": int(os.environ.get("RUNNER_CORES") or 0),
              "mutmut_wall_seconds": int(os.environ.get("MUTMUT_RUN_WALL_SECONDS") or 0),
              "statuses": dict(overall),
              "total_mutants": total,
              "timeout_ratio": round(timeout_ratio, 4),
              "timeout_distrust_ratio": TIMEOUT_DISTRUST_RATIO,
              "gate_floor": GATE_FLOOR,
              "modules": module_stats,
              "tripwire": [module for module, _, _, _ in tripwire],
          }
          with open("mutmut-baseline-telemetry.json", "w", encoding="utf-8") as telemetry_file:
              json.dump(telemetry, telemetry_file, indent=2, sort_keys=True)

          for key in ("killed", "survived", "timeout"):
              print(f"MUTMETRIC {key}={overall[key]}")
          print(f"MUTMETRIC total_mutants={total}")
          print(f"MUTMETRIC timeout_ratio={timeout_ratio:.4f}")
          print(f"MUTMETRIC tripwire_count={len(tripwire)}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Mutation baseline health\n\n")
                  summary.write(
                      f"- mutants: {total} "
                      f"(killed {overall['killed']}, survived {overall['survived']}, "
                      f"timeout {overall['timeout']})\n"
                  )
                  summary.write(
                      f"- repo-wide timeout ratio: {timeout_ratio:.1%} "
                      f"(distrust threshold {TIMEOUT_DISTRUST_RATIO:.0%})\n"
                  )
                  summary.write(f"- tripwire modules: {len(tripwire)}\n\n")
                  if tripwire:
                      summary.write(
                          "Modules meeting the strict gate floor with an implausible "
                          "timeout share. A PR changing one of these files could "
                          "receive a false strict floor:\n\n"
                      )
                      summary.write("| module | timeouts | total | timeout ratio |\n")
                      summary.write("|---|---|---|---|\n")
                      for module, timeouts, module_total, module_ratio in tripwire:
                          summary.write(
                              f"| `{module}` | {timeouts} | {module_total} | "
                              f"{module_ratio:.1%} |\n"
                          )

          outputs_path = os.environ.get("GITHUB_OUTPUT")
          if outputs_path:
              with open(outputs_path, "a", encoding="utf-8") as outputs:
                  outputs.write(f"timeout_ratio={timeout_ratio:.4f}\n")
                  outputs.write(f"tripwire_count={len(tripwire)}\n")
          with open(".tripwire-count", "w", encoding="utf-8") as count_file:
              count_file.write(str(len(tripwire)))

          # Warnings only, never errors: a degraded baseline is data for
          # the dry-mode validation, not a broken main branch.
          if total == 0:
              print("::warning::mutmut produced no result entries; nothing to analyze")
          else:
              if timeout_ratio > TIMEOUT_DISTRUST_RATIO:
                  print(
                      f"::warning::repo-wide timeout ratio {timeout_ratio:.1%} exceeds "
                      f"the {TIMEOUT_DISTRUST_RATIO:.0%} distrust threshold; baseline "
                      "outcomes look contention-contaminated"
                  )
              for module, timeouts, module_total, module_ratio in tripwire:
                  print(
                      f"::warning::{module}: gate score meets the strict "
                      f"{GATE_FLOOR:.0f}% floor while {timeouts}/{module_total} "
                      f"mutants ({module_ratio:.1%}) timed out; a PR changing this "
                      "file could receive a false strict floor"
                  )
          PY
          exit_code="$(cat mutmut-base-exit.txt)"
          tripwire_count="$(cat .tripwire-count)"
          saveable=true
          [ "$exit_code" = "0" ] && [ -s mutmut-base-results.txt ] || saveable=false
          [ "$tripwire_count" = "0" ] || saveable=false
          echo "saveable=${saveable}" >> "$GITHUB_OUTPUT"
          if [ "$MUTMUT_CACHE_DRY_MODE" = "true" ]; then
            echo "DRY MODE: baseline for ${GITHUB_SHA} would be saved=${saveable}"
          fi

      - name: Save the mutation baseline for this SHA
        # Cache only a healthy baseline: a non-zero exit, empty results, or
        # a health-check tripwire (modules whose gate floor is strict
        # while an implausible share of their mutants timed out) must not
        # poison PRs keyed to this SHA. Saving is disabled in dry mode
        # (repository variable MUTMUT_CACHE_DRY_MODE, default true) while
        # the health checks are validated against real runs; PRs then take
        # the always-correct cache-miss path. A cache save failure must
        # never turn main red either — the cache is an optimization whose
        # miss path is the pre-existing target-branch run, so failures
        # here degrade to cache misses on the next PR, not broken
        # pipelines.
        if: steps.baseline-health.outputs.saveable == 'true' && env.MUTMUT_CACHE_DRY_MODE != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mutmut-base-${{ github.sha }}
          path: |
            mutmut-base-results.txt
            mutmut-base-exit.txt
            mutmut-base-output.txt
            mutmut-base-mutated.txt
            mutmut-base-tool.txt

      - name: Upload dry-run baseline and telemetry
        # In dry mode the analyzed baseline is preserved as a workflow
        # artifact instead of an actions cache entry. Artifacts cannot be
        # restored by mutation-regression.yml (it reads the actions cache
        # only), so a poisoned baseline structurally cannot reach a PR
        # while validation is ongoing.
        if: env.MUTMUT_CACHE_DRY_MODE == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-baseline-dryrun
          retention-days: 30
          path: |
            mutmut-base-results.txt
            mutmut-base-exit.txt
            mutmut-base-output.txt
            mutmut-base-mutated.txt
            mutmut-base-tool.txt
            mutmut-baseline-telemetry.json
            mutmut-runner-conditions.txt
            mutmut-load-samples.txt
            mutmut-phase-timings.txt
